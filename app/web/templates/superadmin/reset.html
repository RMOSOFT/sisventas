<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMOSOFT • Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6">
    <div class="mb-5">
      <div class="text-slate-100 text-2xl font-bold">RMOSOFT</div>
      <div class="text-slate-400 text-sm">Restablecer contraseña • Super Admin</div>
    </div>

    <h1 class="text-slate-100 text-xl font-semibold mb-1">Nueva contraseña</h1>
    <p class="text-slate-400 text-sm mb-4">
      Crea una contraseña segura (mínimo 8 caracteres).
    </p>

    <input id="new_pass" type="password"
      class="w-full mb-3 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-600"
      placeholder="Nueva contraseña" />

    <input id="new_pass2" type="password"
      class="w-full mb-4 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-600"
      placeholder="Repite la nueva contraseña" />

    <button id="btn_reset"
      class="w-full rounded-lg py-2 font-semibold text-white bg-blue-700 hover:bg-blue-600 disabled:opacity-60 disabled:cursor-not-allowed">
      Guardar contraseña
    </button>

    <div id="msg" class="text-sm mt-3 text-red-400"></div>

    <a href="/superadmin/login" class="inline-block text-slate-400 text-sm underline mt-3">
      Volver al login
    </a>
  </div>

  <script>
    // token viene desde el backend (querystring) y lo pasamos a Jinja
    const TOKEN = "{{ token }}";
    const msg = document.getElementById("msg");
    const btn = document.getElementById("btn_reset");

    function setMsg(text, kind="error"){
      msg.textContent = text || "";
      msg.className = "text-sm mt-3 " + (kind === "ok" ? "text-green-400" : "text-red-400");
    }

    function validatePass(p1, p2){
      if(!p1 || !p2) return "Completa ambos campos.";
      if(p1.length < 8) return "La contraseña debe tener mínimo 8 caracteres.";
      if(p1 !== p2) return "Las contraseñas no coinciden.";
      return null;
    }

    async function doReset(){
      setMsg("");
      const p1 = document.getElementById("new_pass").value;
      const p2 = document.getElementById("new_pass2").value;

      const err = validatePass(p1, p2);
      if(err){ setMsg(err); return; }

      btn.disabled = true;
      btn.textContent = "Guardando...";

      const res = await fetch("/api/v1/superadmin/auth/reset", {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify({ token: TOKEN, new_password: p1 })
      });

      if(!res.ok){
        const d = await res.json().catch(()=> ({}));
        setMsg(d.detail || "No se pudo restablecer. Vuelve a pedir el enlace.");
        btn.disabled = false;
        btn.textContent = "Guardar contraseña";
        return;
      }

      setMsg("✅ Contraseña actualizada. Redirigiendo al login...", "ok");
      setTimeout(()=> window.location.href = "/superadmin/login", 900);
    }

    document.getElementById("btn_reset").addEventListener("click", doReset);

    document.addEventListener("keydown", (e) => {
      if(e.key === "Enter") doReset();
    });
  </script>
</body>
</html>
