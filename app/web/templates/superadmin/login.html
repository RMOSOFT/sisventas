<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RMOSOFT • Login SuperAdmin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-xl p-6">
    <div class="mb-5">
      <div class="text-slate-100 text-2xl font-bold">RMOSOFT</div>
      <div class="text-slate-400 text-sm">Panel Super Admin</div>
    </div>

    <h1 class="text-slate-100 text-xl font-semibold mb-4">Iniciar sesión</h1>

    <input id="login_user" class="w-full mb-3 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-600"
           placeholder="Email o usuario" />

    <input id="login_pass" type="password" class="w-full mb-4 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-slate-100 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-600"
           placeholder="Contraseña" />

    <button id="btn_login" class="w-full rounded-lg py-2 font-semibold text-white bg-blue-700 hover:bg-blue-600">
      Entrar
    </button>

    <div id="msg" class="text-sm mt-3 text-red-400"></div>

    <button id="btn_forgot" class="text-slate-400 text-sm underline mt-3">
      ¿Olvidaste tu contraseña?
    </button>
  </div>

  <script>
      const msg = document.getElementById("msg");

      function setMsg(text, kind="error"){
        msg.textContent = text || "";
        msg.className = "text-sm mt-3 " + (kind === "ok" ? "text-green-400" : "text-red-400");
      }

      async function doLogin(){
        setMsg("");

        const user = document.getElementById("login_user").value.trim();
        const password = document.getElementById("login_pass").value;

        if(!user || !password){
          setMsg("Completa usuario/email y contraseña.");
          return;
        }

        const res = await fetch("/api/v1/superadmin/auth/login", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ user, password })
        });

        if(!res.ok){
          const d = await res.json().catch(()=> ({}));
          setMsg(d.detail || "Credenciales inválidas");
          return;
        }

        window.location.href = "/superadmin/empresas";
      }

      async function doForgot(){
        setMsg("");

        const user = document.getElementById("login_user").value.trim();
        if(!user){
          setMsg("Escribe tu email o usuario arriba para enviarte el enlace.");
          return;
        }

        const res = await fetch("/api/v1/superadmin/auth/forgot", {
          method: "POST",
          headers: {"Content-Type":"application/json"},
          body: JSON.stringify({ user })
        });

        // respuesta siempre “bonita” (seguridad)
        if(!res.ok){
          // igual mostramos mensaje genérico (no revelar si existe)
          setMsg("Si el usuario existe, te enviamos un enlace. Revisa tu correo y spam.", "ok");
          return;
        }

        setMsg("✅ Si el usuario existe, te enviamos un enlace. Revisa tu correo y spam.", "ok");
      }

      document.getElementById("btn_login").addEventListener("click", doLogin);
      document.getElementById("btn_forgot").addEventListener("click", doForgot);

      // Enter para login
      document.addEventListener("keydown", (e) => {
        if(e.key === "Enter") doLogin();
      });
    </script>
