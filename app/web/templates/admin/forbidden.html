{% extends "admin/base.html" %}
{% block content %}
<div class="max-w-xl mx-auto mt-16 bg-white border rounded-2xl shadow-sm p-6 text-center">
  <h1 class="text-2xl font-bold text-slate-800 mb-2">
    🔒 Acceso restringido
  </h1>

  <p class="text-slate-600 mb-4">
    {{ message or "Esta acción requiere permisos de administrador." }}
  </p>

  <p class="text-sm text-slate-500 mb-6">
    Solicita autorización al administrador del sistema para continuar.
  </p>

  <div class="flex justify-center gap-3">
    <a href="/admin/pos"
       class="px-4 py-2 rounded-lg bg-blue-600 text-white hover:bg-blue-500">
      Ir al POS
    </a>
    <a href="/admin/dashboard"
       class="px-4 py-2 rounded-lg border hover:bg-slate-50">
      Volver al dashboard
    </a>
  </div>
</div>
{% endblock %}
