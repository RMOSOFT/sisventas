{% extends "admin/base_public.html" %}
{% block content %}



<form id="f" class="max-w-sm mx-auto mt-20 bg-white p-6 rounded-xl border">
  <h1 class="text-xl font-bold mb-3">Iniciar sesión</h1>
  <!-- ALERTA -->
  <div
    id="login_notice"
    class="hidden mb-4 flex items-start gap-2 rounded-lg border border-amber-200 bg-amber-50 px-3 py-2 text-sm text-amber-800">
    <span class="text-lg">⚠️</span>
    <span id="login_notice_text"></span>
  </div>

  <input id="email" class="border rounded-lg px-3 py-2 w-full" placeholder="Email" />
  <input id="pass" type="password" class="border rounded-lg px-3 py-2 w-full mt-2" placeholder="Contraseña" />

  <button class="bg-black text-white rounded-lg px-4 py-2 w-full mt-3 font-semibold">Inicia Sesion</button>
  <div id="msg" class="text-sm mt-2"></div>
  <a class="text-sm underline text-slate-500" href="#" id="btn_forgot">¿Olvidaste tu contraseña?</a>
</form>

<script>
document.getElementById("f").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const email = document.getElementById("email").value;
  const password = document.getElementById("pass").value;

  const res = await fetch("/api/v1/admin/auth/login", {
    method:"POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({email, password})
  });
  const data = await res.json();
  if(!res.ok){
    document.getElementById("msg").textContent = data.detail || "Error";
    return;
  }
  // ya hay cookie -> redirige
  window.location.href = "/";
});

document.getElementById("btn_forgot").onclick = async () => {
  const email = document.getElementById("email").value.trim();
  const res = await fetch("/api/v1/admin/auth/forgot", {
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ user: email })
  });
  // no revelamos si existe o no
  alert("Si el usuario existe, te enviamos un enlace al correo.");
};
</script>

<script>
  const params = new URLSearchParams(window.location.search);
  const notice = document.getElementById("login_notice");
  const noticeText = document.getElementById("login_notice_text");

  if (params.get("expired") === "1") {
    noticeText.textContent =
      "Tu sesión expiró por seguridad. Por favor, inicia sesión nuevamente.";
    notice.classList.remove("hidden");
  }
</script>



{% endblock %}
