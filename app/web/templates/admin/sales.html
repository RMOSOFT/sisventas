{% extends "admin/base.html" %}
{% block content %}

<div class="flex flex-col md:flex-row md:items-center md:justify-between gap-2">
    <h1 class="text-xl font-bold">Historial de Ventas</h1>
    <button id="btn_refresh_sales" class="text-sm underline">Actualizar</button>
</div>

<div class="bg-white rounded-xl shadow-sm border mt-3 overflow-hidden">
    <div class="p-3 border-b text-sm text-slate-500 text-white bg-[#0B1F3A]">
    Últimas ventas
    </div>
    <div id="sales_list" class="divide-y"></div>
</div>

<!-- Modal detalle (PRO: responsive + scroll + header sticky) -->
<div id="sale_modal"
     class="fixed inset-0 bg-black/50 hidden z-50">
    <div class="min-h-screen w-full flex items-center justify-center p-3">
        <div class="bg-white rounded-2xl w-full max-w-2xl shadow-xl border
                    max-h-[90vh] overflow-y-auto">

            <!-- Header sticky -->
            <div class="sticky top-0 bg-white border-b px-4 py-3 flex items-center justify-between">
                <div class="font-semibold text-lg" id="sale_title">Venta</div>
                <button id="btn_close_sale_modal"
                class="text-sm underline px-2 py-1 rounded hover:bg-slate-100">
                Cerrar
                </button>
            </div>

            <!-- Body -->
            <div class="p-4">
                <div class="grid gap-2 md:grid-cols-4 text-sm">
                    <div class="border rounded-lg p-2">
                        <div class="text-slate-500">Fecha</div><div id="d_fecha">—</div>
                    </div>
                    <div class="border rounded-lg p-2">
                        <div class="text-slate-500">Pago</div><div id="d_pago">—</div>
                    </div>
                    <div class="border rounded-lg p-2">
                        <div class="text-slate-500">Estado</div><div id="d_estado">—</div>
                    </div>
                    <div class="border rounded-lg p-2">
                        <div class="text-slate-500">Total</div><div class="font-bold" id="d_total">—</div>
                    </div>
                </div>

                <div class="mt-3 border rounded-lg overflow-hidden">
                    <div class="p-2 bg-slate-50 text-sm font-semibold">Detalle</div>
                    <div id="d_items" class="divide-y text-sm"></div>
                </div>

                <div class="mt-3 flex justify-end gap-2">
                    <button id="btn_cancel_sale" class="border rounded-lg px-4 py-2 hover:bg-slate-50">
                    Anular venta
                    </button>

                    <button id="btn_print_placeholder" class="border rounded-lg px-4 py-2 hover:bg-slate-50">
                    Imprimir ticket
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal Anular Venta -->
<div id="cancel_modal" class="fixed inset-0 bg-black/50 hidden z-50">
    <div class="min-h-screen w-full flex items-center justify-center p-3">
        <div class="bg-white rounded-2xl w-full max-w-lg shadow-xl border max-h-[90vh] overflow-y-auto">
            <div class="sticky top-0 bg-white border-b px-4 py-3 flex items-center justify-between">
                <div class="font-semibold text-lg">Anular venta
                </div>
                <button id="btn_cancel_close" class="text-sm underline px-2 py-1 rounded hover:bg-slate-100">Cerrar
                </button>
            </div>

            <div class="p-4">
                <div class="border rounded-xl p-3 bg-slate-50">
                    <div class="text-sm">
                        Estás por anular: <b id="cancel_ticket_label">Ticket #—</b>
                    </div>
                    <div class="text-xs text-slate-500 mt-1">
                        Esta acción devolverá stock automáticamente y la venta dejará de contar en reportes.
                    </div>
                </div>

                <label class="text-sm text-slate-600 block mt-3">Motivo (opcional)
                </label>
                <input id="cancel_motivo" class="border rounded-lg px-3 py-2 w-full mt-1" placeholder="Ej: error de cobro / duplicado"/>

                <div id="cancel_msg" class="text-sm mt-2"></div>

                <div class="mt-3 flex gap-2">
                    <button id="btn_cancel_confirm" class="bg-red-600 text-white rounded-lg px-4 py-2 font-semibold w-full">
                        Sí, anular venta
                    </button>
                    <button id="btn_cancel_back" class="border rounded-lg px-4 py-2 w-full hover:bg-slate-50">
                        Volver
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>


<script>
  window.page = "sales";
</script>
{% endblock %}
